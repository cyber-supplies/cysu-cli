# A version tag builds six native binaries and publishes the platform packages
# before the @cyber-supplies/cysu launcher. npm versions cannot be overwritten.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Vet
        run: go vet ./...

      - name: Build native binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --clean

      - name: Generate npm packages
        run: |
          npx --yes goreleaser-npm-publisher@1.7.0 build --clear \
            --builder cysu \
            --name cysu \
            --bin cysu \
            --prefix @cyber-supplies \
            --repository https://github.com/cyber-supplies/cysu-cli \
            --description "Cyber Supplies CLI" \
            --license UNLICENSED

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/
      - name: Check npm package and launch cysu
        run: node scripts/verify-npm-package.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@cyber-supplies"
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/
      - name: Publish platform packages, then launcher
        run: node scripts/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
