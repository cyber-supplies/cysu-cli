# Release publishes @cyber-supplies/cysu publicly to npmjs when a version
# tag is pushed:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag is the version: v0.1.1 publishes 0.1.1. The version field in
# npm/package.json is overwritten on the runner and never committed, so the
# tag is the single source of truth. npm refuses to overwrite a published
# version, so a re-run of the same tag fails at the publish step.
#
# Add a granular npm access token with publish access to the @cyber-supplies
# scope and bypass 2FA enabled as the repository secret NPM_TOKEN. The package
# is public even if the source repository remains private.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Writes an .npmrc for the public npm registry and NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          scope: "@cyber-supplies"

      - name: Vet
        run: go vet ./...

      - name: Build linux/amd64 binary into the package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o npm/bin/cysu ./cmd/cysu
          ./npm/bin/cysu help

      - name: Set package version from the tag
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Show tarball contents
        run: npm pack --dry-run ./npm

      - name: Publish
        run: npm publish ./npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
